hooks:
- type: "inner-chroot"
  name: "python_upgrade"
  description: |
    Forcing migration to a new Python release.
  entrypoint:
    - /bin/bash
    - -c
  commands:
    - >-
      sed -i -e 's|python3_9|python{{ .Values.python_version2upgrade }}|g'
      /var/git/meta-repo/kits/core-kit/profiles/funtoo/kits/python-kit/mark/make.defaults
    # Unmask py3.10
    - >-
      echo '=dev-lang/python-{{ .Values.python_version2upgrade }}*' >> /etc/portage/package.unmask
    - >-
      export PYTHON_TARGETS="python{{ .Values.python_version2upgrade | replace "."  "_" }}" &&
      export PYTHON_SINGLE_TARGETS="python{{ .Values.python_version2upgrade | replace "." "_" }}" &&
      emerge -av python python-exec
    - >-
      locale-gen
    # avoid again issues with introspection and harfbuzz
    - >-
      export PYTHON_TARGETS="python{{ .Values.python_version2upgrade | replace "." "_" }}" &&
      export PYTHON_SINGLE_TARGETS="python{{ .Values.python_version2upgrade | replace "." "_" }}" &&
      emerge gobject-introspection glib --nodeps
    - >-
      export PYTHON_TARGETS="python{{ .Values.python_version2upgrade | replace "." "_" }}" &&
      export PYTHON_SINGLE_TARGETS="python{{ .Values.python_version2upgrade | replace "." "_" }}" &&
      emerge $(qlist -IC dev-python) pax-utils -j



