hooks:
- type: "inner-chroot"
  name: "python_upgrade"
  description: |
    Forcing migration to a new Python release.
  entrypoint:
    - /bin/bash
    - -c
  commands:
    - >-
      sed -i -e 's|python3_9|python{{ .Values.python_version2upgrade }}|g'
      /var/git/meta-repo/kits/core-kit/profiles/funtoo/kits/python-kit/mark/make.defaults
    # Unmask py3.10
    - >-
      echo '=dev-lang/python-{{ .Values.python_version2upgrade }}*' >> /etc/portage/package.unmask
    - >-
      export PYTHON_TARGETS="python{{ .Values.python_version2upgrade | replace "."  "_" }}" &&
      export PYTHON_SINGLE_TARGET="python{{ .Values.python_version2upgrade | replace "." "_" }}" &&
      eval 'emerge -t -pv python python-exec || true' &&
      emerge -j python python-exec --nodeps
    - >-
      locale-gen
    # avoid again issues with introspection and harfbuzz
    - >-
      export PYTHON_TARGETS="python{{ .Values.python_version2upgrade | replace "." "_" }}" &&
      export PYTHON_SINGLE_TARGET="python{{ .Values.python_version2upgrade | replace "." "_" }}" &&
      emerge gobject-introspection glib --nodeps -j
    - >-
      export PYTHON_TARGETS="python{{ .Values.python_version2upgrade | replace "." "_" }}" &&
      export PYTHON_SINGLE_TARGET="python{{ .Values.python_version2upgrade | replace "." "_" }}" &&
      emerge -DuvN @world -j &&
      eselect python set python{{ .Values.python_version2upgrade }}
    # It seems that some packages keep .pyc files on upgrades. We purge completely
    # the python3.9 directory.
    - >-
      emerge --unmerge dev-lang/python:3.9 &&
      rm -rvf /usr/lib/python3.9/





