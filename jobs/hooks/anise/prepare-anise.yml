hooks:
- type: "outer-pre-chroot"
  name: "prepare-anise"
  description: |
    Setup anise system configuration inside chroot.
  entrypoint:
    - /bin/bash
    - -c
  commands:
    - >-
      {{- if .Values.anise_minimal | default false }}
      cp anise/config-minimal.yaml ${MARKDEVKIT_ROOTFS}/etc/anise/anise.yaml
      {{- else }}
      cp anise/config.yaml ${MARKDEVKIT_ROOTFS}/etc/anise/anise.yaml
      {{- end }}
    # Set rootfs of the chroot as /
    - >-
      yq4 e '.system.rootfs = "/"' ${MARKDEVKIT_ROOTFS}/etc/anise/anise.yaml -i
